services:
  # Container 1: Django Web Application
  web:
    build: .
    container_name: web_app
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Container 2: Node.js WebSocket Server
  websocket:
    build: ./node-websocket-server
    container_name: node_websocket_server
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017/chatapp
    depends_on:
      redis:
        condition: service_healthy

  # Container 3: PostgreSQL Database (Shared Auth)
  db:
    image: postgres:17
    container_name: postgres_db_use
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: reddit_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reddit_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Container 4: Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: redis_cache_ofdb
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Container 5: MongoDB (Document Store)
  mongo:
    image: mongo:7
    container_name: mongodb_service
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  static_volume:
  media_volume:
  mongo_data:
